<section>
  <div class="encabezado">
    <h1>Usuarios</h1>
    <a mat-flat-button routerLink="/usuarios/nuevo">
      <mat-icon>person_add</mat-icon>
      Nuevo usuario
    </a>
  </div>

  @if (cargando()) {
    <p>Cargando usuarios...</p>
  } @else if (error()) {
    <p>Ocurrió un error al cargar los usuarios.</p>
  } @else {
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let usuario">{{ usuario.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let usuario">{{ usuario.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let usuario">{{ usuario.email }}</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let usuario">
          <app-role [rol]="usuario.rol" />
        </td>
      </ng-container>


      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>

        <td mat-cell *matCellDef="let usuario">
          
          <div class="acciones-tabla">
            <app-acciones-usuario [usuario]="usuario" [eliminando]="eliminandoId() === usuario.id" (eliminar)="eliminar($event)"></app-acciones-usuario>

            <!-- Botón para eliminar el USUARIO (se desactiva mientras se está borrando) -->
            
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let fila; columns: columnas"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="columnas.length">No hay usuarios registrados.</td>
      </tr>
    </table>




    <mat-paginator
      [pageSize]="3"
      [pageSizeOptions]="[3, 5, 10]"
      showFirstLastButtons
    ></mat-paginator>
  }
</section>
