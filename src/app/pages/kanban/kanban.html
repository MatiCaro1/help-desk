<section class="kanban">
    <h1>Kanban</h1>

    @if (cargando()) {
        <p>Cargando tickets...</p>
    } @else if (errorCarga()) {
        <p>Ocurrió un error al cargar los tickets.</p>
    } @else {
        <div class="tablero" cdkDropListGroup>
            <app-kanban-columna titulo="Abierto" estado="Abierto" [tickets]="ticketsPorEstado('Abierto')" (cambiarEstado)="actualizarEstado($event.ticket, $event.nuevoEstado)" />
            <app-kanban-columna titulo="En proceso" estado="En proceso" [tickets]="ticketsPorEstado('En proceso')" (cambiarEstado)="actualizarEstado($event.ticket, $event.nuevoEstado)" />
            <app-kanban-columna titulo="Cerrado" estado="Cerrado" [tickets]="ticketsPorEstado('Cerrado')" (cambiarEstado)="actualizarEstado($event.ticket, $event.nuevoEstado)" />
        </div>
    }
</section>
